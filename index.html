        // Compress any uploaded image to a crisp 320x320 JPEG data URL so it never exceeds Firestore or storage limits
        const compressImageFile = (file, maxDim = 320, quality = 0.84) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
                        } else {
                            if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = () => resolve(event.target.result);
                    img.src = event.target.result;
                };
                reader.onerror = (err) => reject(err);
                reader.readAsDataURL(file);
            });
        };

        const buildExamMCQ = ({ section, phase = "BOTH", topic, dynamicTag = false, contextHTML = "", stem, code = "", correctText, distractors, explanation }) => {
            const uniqueDistractors = [...new Set(distractors.map(String))].filter(d => d !== String(correctText));
            while (uniqueDistractors.length < 4) {
                uniqueDistractors.push(`None of these (${uniqueDistractors.length + 1})`);
            }
            const rawOptions = [String(correctText), ...uniqueDistractors.slice(0, 4)];
            const shuffledOptions = shuffleArray(rawOptions);
            const answerIndex = shuffledOptions.indexOf(String(correctText));
            return {
                section,
                phase,

                dynamicTag,
                contextHTML,
                stem,
                code,

                    "Data Controller and Data Subject",
                    "Data Broker and Data Custodian",
                    "Information Auditor and Information Client"
                ],
                explanation: "The DPDP Act 2023 designates the entity determining the purpose and means of data processing as the 'Data Fiduciary' and the individual as the 'Data Principal'."
            },

            // QUANTITATIVE APTITUDE (PRELIMS & MAINS)
            {
                section: "QUANT", phase: "BOTH", topic: "Quantitative Aptitude • Compound Interest",
                stem: "An insurance reserve fund is invested at 20% p.a. for 2 years. If the difference between Compound Interest (annual compounding) and Simple Interest after 2 years is ₹14,400, what is the principal corpus?",
                correctText: "₹3,60,000",
                distractors: ["₹2,88,000", "₹3,20,000", "₹4,00,000", "₹4,50,000"],
                explanation: "For 2 years, CI - SI = P(R/100)² = P(0.20)² = 0.04P. Given 0.04P = 14,400 ⇒ P = 14,400 / 0.04 = ₹3,60,000."
            },
            {
                section: "QUANT", phase: "BOTH", topic: "Quantitative Aptitude • Probability",
                stem: "An incident response pool has 6 Network Engineers and 4 Database Administrators. If a 3-member team is chosen at random, what is the probability that at least ONE Database Administrator is included?",
                correctText: "5/6",
                distractors: ["1/6", "2/3", "3/4", "4/5"],
                explanation: "Total ways = 10C3 = 120. Ways with 0 DBAs (all 3 from 6 Network Engineers) = 6C3 = 20. Probability(at least 1 DBA) = 1 - 20/120 = 5/6."
            },

            // REASONING ABILITY (PRELIMS & MAINS)
            {
                section: "REAS", phase: "BOTH", topic: "Reasoning Ability • Syllogism ('Only a Few')",
                stem: "Statements:\n1. Only a few Servers are Routers.\n2. All Routers are Switches.\n3. No Switch is a Firewall.\nConclusions:\nI. Some Servers are definitely not Firewalls.\nII. All Servers being Switches is a possibility.",
                correctText: "Both Conclusions I and II follow",
                distractors: [
                    "Only Conclusion I follows",
                    "Only Conclusion II follows",
                    "Either Conclusion I or II follows",
                    "Neither Conclusion I nor II follows"
                ],
                explanation: "Since Some Servers are Routers and All Routers are Switches, those Servers are Switches and cannot be Firewalls (I follows). Also, 'Only a few Servers are Routers' does not restrict all Servers from being inside Switches (II follows)."
            },
            {
                section: "REAS", phase: "BOTH", topic: "Reasoning Ability • Floor Puzzle",
                stem: "Six NICL IT Officers (P, Q, R, S, T, U) live on floors 1 to 6. R (Cloud) lives on an even floor below 4. Two officers live between R and S (ERP). P (Network) lives immediately below S, and T (Cyber) lives immediately above S. Q (Database) lives on Floor 1. Who lives on Floor 4 and Floor 3 respectively?",
                correctText: "Floor 4: P (Network) | Floor 3: U (AI)",
                distractors: [
                    "Floor 4: S (ERP) | Floor 3: P (Network)",
                    "Floor 4: U (AI) | Floor 3: R (Cloud)",
                    "Floor 4: T (Cyber) | Floor 3: S (ERP)",
                    "Floor 4: P (Network) | Floor 3: Q (Database)"
                ],
                explanation: "R is on Floor 2 (even floor < 4). Two floors between R(2) and S places S on Floor 5. T is above S (Floor 6), P is below S (Floor 4). Q is on Floor 1, leaving U on Floor 3."
            },

            // ENGLISH LANGUAGE (PRELIMS & MAINS)
            {
                section: "ENG", phase: "BOTH", topic: "English Language • Error Spotting",
                stem: "Identify the segment with a grammatical error:\n(A) Neither the Chief Information Security Officer / (B) nor the database administrators / (C) was apprised of the schema migration / (D) before the maintenance window.",
                correctText: "Segment (C) — 'was apprised' should be 'were apprised'",
                distractors: ["Segment (A)", "Segment (B)", "Segment (D)", "No Error"],
                explanation: "With 'Neither... nor', the verb agrees with the closer subject ('database administrators', plural), so 'were apprised' is required."
            },
            {
                section: "ENG", phase: "BOTH", topic: "English Language • Contextual Fillers",
                stem: "While generative AI can ________ routine claim documentation, human underwriters remain ________ for evaluating bespoke industrial and marine risks.",
                correctText: "expedite — indispensable",
                distractors: [
                    "obstruct — redundant",
                    "fabricate — obsolete",
                    "stagnate — peripheral",
                    "aggravate — superfluous"
                ],
                explanation: "'Expedite' (speed up) and 'indispensable' (essential) fit the logical contrast introduced by 'While'."
            }
        ];

        const NICLExamSimulator = ({ user, notify }) => {
            const [examPhase, setExamPhase] = useState('MAINS'); // 'PRELIMS', 'MAINS', 'INTERVIEW'
            const [sectionFilter, setSectionFilter] = useState('ALL');
            const [questions, setQuestions] = useState([]);
            const [answers, setAnswers] = useState({});
            const [reviewMarks, setReviewMarks] = useState({});
            const [submitted, setSubmitted] = useState(false);
            const [instantCheck, setInstantCheck] = useState(false);
            const [attemptNo, setAttemptNo] = useState(1);
            const [paperSeed, setPaperSeed] = useState('');
            const [timeLeft, setTimeLeft] = useState(180 * 60);
            const [timerRunning, setTimerRunning] = useState(true);
            const [essayText, setEssayText] = useState('');
            const [precisText, setPrecisText] = useState('');
            const [showModelDesc, setShowModelDesc] = useState(false);
            const [attemptHistory, setAttemptHistory] = useState([]);

            useEffect(() => {
                try {
                    const savedHist = localStorage.getItem(`atlas_nicl_history_${user?.uid || 'guest'}`);
                    if (savedHist) setAttemptHistory(JSON.parse(savedHist));
                } catch (e) {}
            }, [user]);

            const generateFreshPaper = (targetPhase = examPhase) => {
                setSubmitted(false);
                setAnswers({});
                setReviewMarks({});
                const nextAttempt = parseInt(localStorage.getItem('atlas_nicl_attempt_count') || '0', 10) + 1;
                localStorage.setItem('atlas_nicl_attempt_count', String(nextAttempt));
                setAttemptNo(nextAttempt);
                setPaperSeed(Math.random().toString(36).substring(2, 8).toUpperCase());

                const procedural = generateProceduralNICLQuestions();
                const curated = shuffleArray(getCuratedNICLQuestionPool()).map(item => buildExamMCQ(item));
                const combined = [...procedural, ...curated];

                const filteredByPhase = targetPhase === 'PRELIMS'
                    ? combined.filter(q => ['QUANT', 'REAS', 'ENG'].includes(q.section))
                    : combined;

                const order = { IT: 1, COMP: 2, GA: 3, QUANT: 4, REAS: 5, ENG: 6 };
                filteredByPhase.sort((a, b) => (order[a.section] || 9) - (order[b.section] || 9));

                setQuestions(filteredByPhase);
                setTimeLeft(targetPhase === 'PRELIMS' ? 60 * 60 : 180 * 60);
                setTimerRunning(true);
            };

            useEffect(() => {
                generateFreshPaper(examPhase);
            }, [examPhase]);

            useEffect(() => {
                if (!timerRunning || submitted || examPhase === 'INTERVIEW') return;
                const t = setInterval(() => {
                    setTimeLeft(prev => (prev > 0 ? prev - 1 : 0));
                }, 1000);
                return () => clearInterval(t);
            }, [timerRunning, submitted, examPhase]);

            const formatTimer = (sec) => {
                const m = String(Math.floor(sec / 60)).padStart(2, '0');
                const s = String(sec % 60).padStart(2, '0');
                return `${m}:${s}`;
            };

            const handleSelectOption = (qIdx, optIdx) => {
                if (submitted) return;
                setAnswers(prev => ({ ...prev, [qIdx]: optIdx }));
            };

            const handleClearOption = (qIdx) => {
                if (submitted) return;
                setAnswers(prev => {
                    const copy = { ...prev };
                    delete copy[qIdx];
                    return copy;
                });
            };

            const handleToggleReview = (qIdx) => {
                setReviewMarks(prev => ({ ...prev, [qIdx]: !prev[qIdx] }));
            };

            const scoreMetrics = useMemo(() => {
                let correct = 0, wrong = 0, unattempted = 0;
                questions.forEach((q, idx) => {
                    if (answers[idx] === undefined) unattempted++;
                    else if (answers[idx] === q.answerIndex) correct++;
                    else wrong++;
                });
                const netScore = +(correct * 1.0 - wrong * 0.25).toFixed(2);
                const attempted = correct + wrong;
                const accuracy = attempted > 0 ? ((correct / attempted) * 100).toFixed(1) : '0.0';
                return { correct, wrong, unattempted, attempted, netScore, accuracy };
            }, [questions, answers]);

            const handleSubmitExam = () => {
                setSubmitted(true);
                setTimerRunning(false);
                const record = {
                    attempt: attemptNo,
                    seed: paperSeed,
                    phase: examPhase,
                    score: scoreMetrics.netScore,
                    total: questions.length,
                    accuracy: scoreMetrics.accuracy,
                    date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                const updatedHist = [record, ...attemptHistory].slice(0, 8);
                setAttemptHistory(updatedHist);
                try {
                    localStorage.setItem(`atlas_nicl_history_${user?.uid || 'guest'}`, JSON.stringify(updatedHist));
                } catch (e) {}
                notify(`Exam Evaluated! Net Score: ${scoreMetrics.netScore} / ${questions.length}`, 'success');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const letters = ['A', 'B', 'C', 'D', 'E'];
            const secNames = {
                ALL: 'All Sections',
                IT: 'Sec 1: Professional IT (Core)',
                COMP: 'Sec 2: Computer Knowledge',
                GA: 'Sec 3: Insurance & Banking GA',
                QUANT: 'Sec 4: Quantitative Aptitude',
                REAS: 'Sec 5: Reasoning Ability',
                ENG: 'Sec 6: English Language',
                DESC: 'Sec 7: Descriptive Typing (30M)'
            };

            const interviewQuestions = [
                {
                    cat: "Core IT & Database Architecture",
                    q: "Explain ACID properties using an online NICL insurance premium payment failure scenario.",
                    a: "Atomicity ensures that if a policyholder's UPI debit succeeds but policy ledger insertion fails, the entire transaction rolls back automatically. Consistency preserves ledger constraints; Isolation (via Strict 2PL/MVCC) prevents race conditions on concurrent renewals; Durability (Write-Ahead Logging) guarantees committed policies survive power outages."
                },
                {
                    cat: "Cyber Security & DPDP Act 2023",
                    q: "How do you secure NICL's web portals against SQL Injection, XSS, and DDoS, and what is NICL's role under the DPDP Act 2023?",
                    a: "Use Parameterized Queries (Prepared Statements) to neutralize SQLi, Content-Security-Policy + HttpOnly cookies + output encoding against XSS, and WAF + Anycast CDN rate-limiting against DDoS. Under the DPDP Act 2023, NICL is a 'Data Fiduciary' obligated to protect 'Data Principals' (policyholders) with explicit consent and breach reporting."
                },
                {
                    cat: "General Insurance & Actuarial Principles",
                    q: "Differentiate between Subrogation and Contribution with a real claim example.",
                    a: "Contribution applies when a warehouse is insured with multiple insurers (each pays in proportion to Sum Insured). Subrogation applies after NICL pays a claim caused by a negligent third party—NICL steps into the insured's legal shoes to recover the payout from the third party."
                },
                {
                    cat: "Disaster Recovery & High Availability",
                    q: "What is the operational difference between RTO and RPO in a Core Insurance Data Center?",
                    a: "RPO (Recovery Point Objective) is the maximum age of data that can be lost (e.g., 15 minutes, dictating synchronous/near-sync database replication). RTO (Recovery Time Objective) is the maximum tolerable downtime before operations resume at the DR site (e.g., 2 hours)."
                }
            ];

            return (
                <div className="animate-slide-in-3d max-w-6xl mx-auto px-4 py-8">
                    {/* Top Exam Control Banner */}
                    <div className="glass-panel p-6 rounded-3xl mb-6 border-t-2 border-brand">
                        <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                            <div>
                                <div className="flex items-center gap-2 text-xs font-mono uppercase tracking-widest text-brand mb-1">
                                    <span>NATIONAL INSURANCE CO. LTD. (NICL)</span>
                                    <span>•</span>
                                    <span>Attempt #{attemptNo} (Seed: {paperSeed})</span>
                                </div>
                                <h2 className="text-2xl md:text-3xl font-extrabold gradient-text">
                                    NICL AO (IT Specialist) Real-Time Exam Simulator
                                </h2>
                                <p className="text-xs text-gray-400 mt-1">
                                    Official 5-Option (A–E) Pattern • +1.00 Correct | -0.25 Negative Marking • Fresh Dynamic Numbers Every Attempt
                                </p>
                            </div>

                            <div className="flex flex-wrap items-center gap-3">
                                {examPhase !== 'INTERVIEW' && (
                                    <div className="px-4 py-2 rounded-xl bg-amber-500/20 border border-amber-500/50 text-amber-300 font-mono font-bold text-lg flex items-center gap-2">
                                        <span>⏱ {formatTimer(timeLeft)}</span>
                                        <button
                                            onClick={() => setTimerRunning(!timerRunning)}
                                            className="text-xs px-2 py-0.5 rounded bg-black/40 hover:bg-black/60 text-white"
                                        >
                                            {timerRunning ? 'Pause' : 'Resume'}
                                        </button>
                                    </div>
                                )}
                                <button
                                    onClick={() => {
                                        generateFreshPaper(examPhase);
                                        notify(`Loaded Fresh Exam Paper (Attempt #${attemptNo + 1})!`, 'success');
                                    }}
                                    className="px-4 py-2.5 bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/50 text-emerald-300 rounded-xl font-bold text-xs uppercase tracking-wider transition"
                                >
                                    ⚡ Load New Questions (Attempt #{attemptNo + 1})
                                </button>
                                {examPhase !== 'INTERVIEW' && !submitted && (
                                    <button
                                        onClick={handleSubmitExam}
                                        className="px-5 py-2.5 bg-brand text-black hover:bg-brandDark rounded-xl font-bold text-xs uppercase tracking-wider transition shadow-[0_0_15px_rgba(0,242,254,0.4)]"
                                    >
                                        ✔ Submit & Evaluate
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Phase Switcher */}
                        <div className="flex flex-wrap gap-2 mt-5 pt-4 border-t border-white/10 justify-between items-center">
                            <div className="flex flex-wrap gap-2">
                                <button
                                    onClick={() => { setExamPhase('PRELIMS'); setSectionFilter('ALL'); }}
                                    className={`px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition ${examPhase === 'PRELIMS' ? 'bg-brand text-black' : 'bg-white/5 hover:bg-white/10 text-gray-300'}`}
                                >
                                    Phase I: Prelims (Quant / Reas / Eng)
                                </button>
                                <button
                                    onClick={() => { setExamPhase('MAINS'); setSectionFilter('ALL'); }}
                                    className={`px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition ${examPhase === 'MAINS' ? 'bg-brand text-black' : 'bg-white/5 hover:bg-white/10 text-gray-300'}`}
                                >
                                    Phase II: Mains (IT Core + All Sections + Desc)
                                </button>
                                <button
                                    onClick={() => setExamPhase('INTERVIEW')}
                                    className={`px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition ${examPhase === 'INTERVIEW' ? 'bg-purple-500 text-white' : 'bg-white/5 hover:bg-white/10 text-gray-300'}`}
                                >
                                    Phase III: Personal Interview Bank
                                </button>
                            </div>

                            {examPhase !== 'INTERVIEW' && (
                                <label className="flex items-center gap-2 text-xs text-gray-300 cursor-pointer select-none">
                                    <input
                                        type="checkbox"
                                        checked={instantCheck}
                                        onChange={e => setInstantCheck(e.target.checked)}
                                        className="accent-cyan-400 w-4 h-4"
                                    />
                                    <span>Instant Answer & Explanation Mode</span>
                                </label>
                            )}
                        </div>

                        {/* Section Filter Pills */}
                        {examPhase !== 'INTERVIEW' && (
                            <div className="flex flex-wrap gap-2 mt-4">
                                {Object.entries(secNames)
                                    .filter(([key]) => examPhase === 'MAINS' || ['ALL', 'QUANT', 'REAS', 'ENG'].includes(key))
                                    .map(([key, label]) => (
                                        <button
                                            key={key}
                                            onClick={() => setSectionFilter(key)}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition border ${
                                                sectionFilter === key
                                                    ? 'bg-brand/20 border-brand text-brand'
                                                    : 'bg-black/30 border-white/10 text-gray-400 hover:text-white'
                                            }`}
                                        >
                                            {label}
                                        </button>
                                    ))}
                            </div>
                        )}
                    </div>

                    {/* Score Summary Card (if Submitted) */}
                    {submitted && examPhase !== 'INTERVIEW' && (
                        <div className="glass-panel p-6 rounded-3xl mb-6 border border-emerald-500/40 bg-emerald-950/20 animate-slide-up">
                            <div className="flex flex-wrap justify-between items-center gap-4 mb-4">
                                <h3 className="text-xl font-bold text-emerald-400">
                                    📊 Official NICL AO IT Evaluation — Attempt #{attemptNo}
                                </h3>
                                <button
                                    onClick={() => generateFreshPaper(examPhase)}
                                    className="px-4 py-2 bg-emerald-500 text-black font-bold rounded-xl text-xs uppercase tracking-wider hover:bg-emerald-400 transition"
                                >
                                    🔄 Start Next Attempt with New Questions
                                </button>
                            </div>
                            <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 text-center">
                                <div className="p-3 rounded-xl bg-black/40 border border-white/10">
                                    <div className="text-2xl font-black text-brand">{scoreMetrics.netScore} / {questions.length}</div>
                                    <div className="text-[11px] text-gray-400 uppercase">Net Score (-0.25 Neg)</div>
                                </div>
                                <div className="p-3 rounded-xl bg-black/40 border border-white/10">
                                    <div className="text-2xl font-black text-emerald-400">{scoreMetrics.correct}</div>
                                    <div className="text-[11px] text-gray-400 uppercase">Correct (+1.00)</div>
                                </div>
                                <div className="p-3 rounded-xl bg-black/40 border border-white/10">
                                    <div className="text-2xl font-black text-red-400">{scoreMetrics.wrong}</div>
                                    <div className="text-[11px] text-gray-400 uppercase">Wrong (-0.25)</div>
                                </div>
                                <div className="p-3 rounded-xl bg-black/40 border border-white/10">
                                    <div className="text-2xl font-black text-gray-300">{scoreMetrics.unattempted}</div>
                                    <div className="text-[11px] text-gray-400 uppercase">Unattempted</div>
                                </div>
                                <div className="p-3 rounded-xl bg-black/40 border border-white/10">
                                    <div className="text-2xl font-black text-amber-400">{scoreMetrics.accuracy}%</div>
                                    <div className="text-[11px] text-gray-400 uppercase">Accuracy</div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Phase III Interview View */}
                    {examPhase === 'INTERVIEW' ? (
                        <div className="grid md:grid-cols-2 gap-6">
                            {interviewQuestions.map((item, idx) => (
                                <div key={idx} className="glass-panel p-6 rounded-2xl border-l-4 border-purple-500">
                                    <span className="text-xs font-mono uppercase tracking-wider text-purple-400 block mb-2">{item.cat}</span>
                                    <h3 className="text-lg font-bold text-white mb-3">Q{idx + 1}. {item.q}</h3>
                                    <div className="p-4 rounded-xl bg-black/40 border border-white/10 text-sm text-gray-300 leading-relaxed">
                                        <strong className="text-brand block mb-1">Panel Model Response:</strong>
                                        {item.a}
                                    </div>
                                </div>
                            ))}
                        </div>
                    ) : (
                        /* Phase I & II Main Exam Grid */
                        <div className="grid lg:grid-cols-3 gap-6 items-start">
                            {/* Left 2 Columns: Questions + Descriptive */}
                            <div className="lg:col-span-2 space-y-5">
                                {sectionFilter !== 'DESC' && questions.map((q, qIdx) => {
                                    if (sectionFilter !== 'ALL' && q.section !== sectionFilter) return null;
                                    const userPick = answers[qIdx];
                                    const isReviewed = reviewMarks[qIdx];
                                    const reveal = submitted || (instantCheck && userPick !== undefined);

                                    return (
                                        <div key={qIdx} id={`nicl-q-${qIdx}`} className="glass-panel p-6 rounded-2xl border border-white/10">
                                            <div className="flex flex-wrap justify-between items-center gap-2 pb-3 mb-3 border-b border-white/10">
                                                <span className="font-extrabold text-brand text-sm">Question {qIdx + 1}</span>
                                                <div className="flex flex-wrap gap-2">
                                                    <span className="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-white/10 text-gray-200">{q.topic}</span>
                                                    {q.dynamicTag && (
                                                        <span className="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40">
                                                            ⚡ Procedural Numerical
                                                        </span>
                                                    )}
                                                </div>
                                            </div>

                                            {q.contextHTML && (
                                                <div
                                                    className="mb-4 p-3 rounded-xl bg-black/40 border border-brand/20"
                                                    dangerouslySetInnerHTML={{ __html: q.contextHTML }}
                                                />
                                            )}

                                            <p className="text-sm md:text-base font-semibold text-gray-100 whitespace-pre-line mb-4 leading-relaxed">
                                                {q.stem}
                                            </p>

                                            <div className="space-y-2.5">
                                                {q.options.map((optText, oIdx) => {
                                                    let btnStyle = "border-white/10 bg-black/30 hover:bg-white/10 text-gray-200";
                                                    if (userPick === oIdx) {
                                                        btnStyle = "border-brand bg-brand/15 text-white font-semibold";
                                                    }
                                                    if (reveal) {
                                                        if (oIdx === q.answerIndex) {
                                                            btnStyle = "border-emerald-500 bg-emerald-500/20 text-emerald-200 font-bold";
                                                        } else if (userPick === oIdx && oIdx !== q.answerIndex) {
                                                            btnStyle = "border-red-500 bg-red-500/20 text-red-200";
                                                        }
                                                    }

                                                    return (
                                                        <button
                                                            key={oIdx}
                                                            type="button"
                                                            onClick={() => handleSelectOption(qIdx, oIdx)}
                                                            className={`w-full text-left p-3 rounded-xl border transition flex items-start gap-3 text-sm ${btnStyle}`}
                                                        >
                                                            <span className="w-6 h-6 rounded-full bg-white/10 border border-white/20 flex items-center justify-center text-xs font-bold flex-shrink-0">
                                                                {letters[oIdx]}
                                                            </span>
                                                            <span>{optText}</span>
                                                        </button>
                                                    );
                                                })}
                                            </div>

                                            <div className="flex flex-wrap justify-between items-center gap-2 mt-4 pt-3 border-t border-white/10 text-xs">
                                                <div className="flex gap-2">
                                                    <button
                                                        type="button"
                                                        onClick={() => handleToggleReview(qIdx)}
                                                        className={`px-3 py-1.5 rounded-lg border transition ${isReviewed ? 'bg-purple-500/20 border-purple-400 text-purple-300' : 'bg-white/5 border-white/10 text-gray-400 hover:text-white'}`}
                                                    >
                                                        {isReviewed ? '★ Marked for Review' : '☆ Mark for Review'}
                                                    </button>
                                                    <button
                                                        type="button"
                                                        onClick={() => handleClearOption(qIdx)}
                                                        className="px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 text-gray-400 hover:text-white transition"
                                                    >
                                                        Clear
                                                    </button>
                                                </div>
                                                <span className="text-gray-500 font-mono">+1.00 / -0.25</span>
                                            </div>

                                            {reveal && (
                                                <div className="mt-4 p-4 rounded-xl bg-emerald-950/40 border border-emerald-500/40 text-xs text-emerald-200 leading-relaxed">
                                                    <div className="font-bold text-emerald-400 mb-1">
                                                        ✔ Correct Answer: ({letters[q.answerIndex]}) {q.options[q.answerIndex]}
                                                    </div>
                                                    <div>{q.explanation}</div>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}

                                {/* Descriptive Paper Section (Mains) */}
                                {(sectionFilter === 'ALL' || sectionFilter === 'DESC') && examPhase === 'MAINS' && (
                                    <div className="glass-panel p-6 rounded-2xl border-l-4 border-brand space-y-4">
                                        <div className="flex justify-between items-center flex-wrap gap-2">
                                            <h3 className="text-lg font-bold text-brand">
                                                Phase II — Descriptive English Test (30 Marks • 30 Mins)
                                            </h3>
                                            <button
                                                type="button"
                                                onClick={() => setShowModelDesc(!showModelDesc)}
                                                className="px-3 py-1.5 rounded-lg bg-brand/20 text-brand border border-brand/40 text-xs font-bold"
                                            >
                                                {showModelDesc ? 'Hide Model Answers' : 'Show Model Essay & Précis'}
                                            </button>

            const handleCreateGmailAccount = async (e) => {

                    triggerToast("Please choose a Gmail username.", "error");

                if (!cleanEmail.includes('@')) {

                    triggerToast("Use 6 or more characters for your password.", "error");
                    return;
                }
                if (createPassword !== confirmPassword) {
                    triggerToast("Passwords do not match. Please verify.", "error");
                    return;
                }

                setIsAuthenticating(true);
                const fullName = `${cleanFirst} ${cleanLast}`.trim() || cleanEmail.split('@')[0];
                let uid = 'gmail_' + btoa(cleanEmail).replace(/[^a-zA-Z0-9]/g, '').substring(0, 16);

                // Try Firebase Email/Password creation first, with seamless fallback to local persistent Gmail registry
                if (auth && authMod?.createUserWithEmailAndPassword) {
                    try {
                        const cred = await authMod.createUserWithEmailAndPassword(auth, cleanEmail, createPassword);

                // Save in local Gmail accounts registry so user can sign in anytime with email & password
                try {
                    const regRaw = localStorage.getItem('atlas_gmail_accounts_v2');
                    const reg = regRaw ? JSON.parse(regRaw) : {};
                    reg[cleanEmail] = {
                        uid,
                        email: cleanEmail,
                        password: createPassword,
                        name: fullName,
                        avatar: signupAvatar || null,
                        bio: 'Google Account Explorer',
                        role: 'user',
                        provider: 'Google Account'
                    };

                } catch (err) {}

                const newUserObj = {
                    uid,
                    email: cleanEmail,
                    name: fullName,
                    avatar: signupAvatar || null,
                    bio: 'Google Account Explorer',
                    role: 'user',
                    provider: 'Google Account'

            const handleGmailSignIn = async (e) => {

                setIsAuthenticating(true);

                            await fb.setDoc(userRef, {
                                id: currentUser.uid,

                                name: finalName,
                                role: 'user',

                            role: 'user',
                            avatar: finalAvatar,
                            bio: finalBio,
                            provider: 'Google Account'

                        saveUserProfileCache(googleUserObj);

                                        className="bg-black/40 border border-brand/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand transition text-brand font-mono"
                                    />
                                    <button
                                        type="submit"
                                        disabled={isAuthenticating}
                                        className="w-full py-3 bg-brand text-black font-bold rounded-xl hover:bg-brandDark transition uppercase tracking-wider mt-2 flex justify-center items-center gap-2"
                                    >
                                        {isAuthenticating ? <Icons.Spinner /> : 'Initialize God Mode'}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setAuthScreenMode('options')}
                                        className="w-full py-2 text-gray-400 hover:text-white transition text-sm"
                                    >
                                        Cancel Protocol
                                    </button>
                                </form>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="relative min-h-screen flex flex-col">
                    <ToastNotification message={toastData.message} type={toastData.type} onClose={() => setToastData({message: ''})} />
                    
                    {bgMedia && <img src={bgMedia} className="fullscreen-bg" alt="Custom BG" />}
                    {!bgMedia && <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-brandDark/10 via-dark to-black -z-10 fixed"></div>}
                    
                    <label className="fixed bottom-24 right-24 md:right-32 z-40 p-4 glass-panel rounded-full cursor-pointer hover:bg-white/20 transition group shadow-[0_0_15px_rgba(255,255,255,0.1)] hover:shadow-[0_0_25px_rgba(255,255,255,0.2)] flex items-center justify-center" title="Customize Background">
                        <Icons.Pen />
                        <input type="file" accept="image/*" className="hidden" onChange={handleBgUpload} />
                        <span className="absolute -top-10 bg-black text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition whitespace-nowrap border border-white/10 pointer-events-none">Upload BG</span>
                    </label>

                    <nav className="fixed top-0 w-full glass-panel z-50 h-16 flex items-center px-4 justify-between transition-colors">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setMenuOpen(true)} className="p-2 hover:bg-white/10 rounded transition"><Icons.Menu /></button>
                            {view !== 'home' && view !== 'login' && (
                                <button onClick={() => navigate('home')} className="p-2 hover:bg-white/10 rounded transition flex items-center gap-2 text-sm text-gray-300 hover:text-white">
                                    <Icons.Back /> <span className="hidden sm:inline font-bold uppercase tracking-wider">Back</span>
                                </button>
                            )}
                            <span onClick={() => navigate('home')} className="text-2xl font-black neon-text uppercase tracking-widest cursor-pointer select-none hidden sm:block ml-2">ATLAS</span>
                        </div>

                        <div className="flex items-center gap-3">
                            <button
                                onClick={() => navigate('nicl_exam')}
                                className={`px-3.5 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider transition flex items-center gap-1.5 border ${
                                    view === 'nicl_exam'
                                        ? 'bg-brand text-black border-brand shadow-[0_0_15px_rgba(0,242,254,0.5)]'
                                        : 'bg-brand/15 text-brand border-brand/40 hover:bg-brand/25'
                                }`}
                            >
                                <Icons.Academic />
                                <span>NICL AO IT Exam</span>
                            </button>

                            <div className="flex items-center gap-2.5 cursor-pointer hover:bg-white/10 p-1 pr-3 rounded-full transition border border-transparent hover:border-white/15" onClick={() => navigate('profile')} title="Click to edit your Name or Photo">
                                <img
                                    src={user.avatar || `https://placehold.co/100x100/0f2942/00f2fe?text=${encodeURIComponent((user.name || 'U').charAt(0).toUpperCase())}`}
                                    alt="Profile"
                                    className="w-9 h-9 rounded-full border-2 border-brand/60 object-cover"
                                />
                                <div className="hidden md:flex flex-col text-left">
                                    <span className="text-xs font-bold leading-tight text-white">{user.name}</span>
                                    <span className="text-[10px] text-brand leading-tight">Edit Profile</span>
                                </div>
                            </div>
                        </div>
                    </nav>

                    {menuOpen && (
                        <div className="fixed inset-0 z-[60] bg-black/50 backdrop-blur-md flex" onClick={() => setMenuOpen(false)}>
                            <div className="w-64 sm:w-80 h-full glass-panel border-r border-white/20 p-6 flex flex-col overflow-y-auto" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-8">
                                    <span className="text-xl font-bold gradient-text tracking-widest">NAVIGATION</span>
                                    <button onClick={() => setMenuOpen(false)} className="hover:text-brand transition"><Icons.X /></button>
                                </div>
                                <div className="flex flex-col gap-2 font-medium">
                                    {['home', 'profile', 'projects', 'education', 'skills', 'experience'].map(item => (
                                        <button
                                            key={item}
                                            onClick={() => navigate(item)}
                                            className={`text-left px-4 py-3 rounded transition uppercase tracking-wider text-sm ${view === item ? 'bg-brand/20 text-brand font-bold' : 'hover:bg-white/10 text-gray-200'}`}
                                        >
                                            {item}
                                        </button>
                                    ))}
                                    <button
                                        onClick={() => navigate('nicl_exam')}
                                        className={`text-left px-4 py-3 rounded transition uppercase tracking-wider text-sm font-bold border mt-2 flex items-center gap-2 ${
                                            view === 'nicl_exam'
                                                ? 'bg-brand text-black border-brand'
                                                : 'bg-brand/15 hover:bg-brand/25 text-brand border-brand/40'
                                        }`}
                                    >
                                        <Icons.Academic /> NICL AO IT Exam Hub
                                    </button>
                                    <button onClick={() => navigate('terminal')} className="text-left px-4 py-3 rounded hover:bg-brand/20 text-brand transition uppercase tracking-wider text-sm font-bold border border-brand/20 mt-2">
                                        &gt;_ Terminal
                                    </button>
                                    {user?.role === 'admin' && (
                                        <button onClick={() => navigate('admin')} className="text-left px-4 py-3 rounded hover:bg-red-500/20 text-red-400 transition uppercase tracking-wider text-sm font-bold border border-red-500/20 mt-4">
                                            Admin System
                                        </button>
                                    )}
                                </div>
                                <div className="mt-auto pt-6 border-t border-white/10">
                                    <button onClick={handleLogout} className="w-full text-left px-4 py-3 rounded hover:bg-red-500/20 hover:text-red-300 transition uppercase tracking-wider text-sm text-gray-400">
                                        Log Out
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="flex-grow pt-24 pb-32">
                        {view === 'home' && <Home adminProfile={adminProfile} user={user} onNavigate={navigate} />}
                        {view === 'skills' && <Skills />}
                        {view === 'experience' && <Experience />}
                        {view === 'education' && <Education />}
                        {view === 'projects' && <Projects />}
                        {view === 'nicl_exam' && <NICLExamSimulator user={user} notify={triggerToast} />}
                        {view === 'profile' && <ProfileSettings user={user} setUser={setUser} setAdminProfile={setAdminProfile} theme={theme} setTheme={setTheme} notify={triggerToast} />}
                        {view === 'terminal' && <InteractiveTerminal />}
                        {view === 'admin' && user?.role === 'admin' && <AdminDashboard currentUser={user} notify={triggerToast} />}
                        {view === 'admin' && user?.role !== 'admin' && (
                            <div className="flex justify-center items-center h-[50vh]"><p className="text-red-500 font-mono text-xl border border-red-500 p-4 bg-red-500/10 rounded">ACCESS DENIED. OMEGA PRIVILEGES REQUIRED.</p></div>
                        )}
                        <Footer />
                    </main>

                    <div className="fixed bottom-0 w-full p-4 z-30 pointer-events-none">
                        <div className="glass-panel mx-auto max-w-2xl rounded-2xl h-14 flex items-center justify-around px-4 pointer-events-auto shadow-2xl border border-white/10">
                           <button onClick={()=>navigate('home')} className={`text-xs uppercase font-bold tracking-widest hover:text-brand transition ${view==='home'?'text-brand drop-shadow-[0_0_5px_#00f2fe]':'text-gray-400'}`}>Overview</button>
                           <button onClick={()=>navigate('projects')} className={`text-xs uppercase font-bold tracking-widest hover:text-brand transition ${view==='projects'?'text-brand drop-shadow-[0_0_5px_#00f2fe]':'text-gray-400'}`}>Work</button>
                           <button onClick={()=>navigate('skills')} className={`text-xs uppercase font-bold tracking-widest hover:text-brand transition ${view==='skills'?'text-brand drop-shadow-[0_0_5px_#00f2fe]':'text-gray-400'}`}>Arsenal</button>
                           <button onClick={()=>navigate('nicl_exam')} className={`text-xs uppercase font-bold tracking-widest hover:text-brand transition flex items-center gap-1 ${view==='nicl_exam'?'text-brand drop-shadow-[0_0_5px_#00f2fe]':'text-emerald-400'}`}>★ NICL Exam</button>
                           <button onClick={()=>navigate('profile')} className={`text-xs uppercase font-bold tracking-widest hover:text-brand transition ${view==='profile'?'text-brand drop-shadow-[0_0_5px_#00f2fe]':'text-gray-400'}`}>Profile</button>
                        </div>
                    </div>

                    {view !== 'login' && <ChatSystem currentUser={user} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
