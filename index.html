        // Compress any uploaded image to a crisp 320x320 JPEG data URL so it never exceeds Firestore or storage limits
        const compressImageFile = (file, maxDim = 320, quality = 0.84) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
                        } else {
                            if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = () => resolve(event.target.result);
                    img.src = event.target.result;
                };
                reader.onerror = (err) => reject(err);
                reader.readAsDataURL(file);
            });
        };

            try {
                const mapRaw = localStorage.getItem('atlas_user_profiles_v2');
                const map = mapRaw ? JSON.parse(mapRaw) : {};
                map[userObj.uid] = {

            } catch (e) {
                console.warn("Profile cache save warning:", e);

            };

            const handleBgUpload = (e) => {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = (event) => setBgMedia(event.target.result);
                    reader.readAsDataURL(file);
                }
            };

            const handleSignupAvatarUpload = async (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                try {
                    const compressed = await compressImageFile(file, 300, 0.85);
                    setSignupAvatar(compressed);
                } catch (err) {}
            };

            if (view === 'login' || !user) {
                return (
                    <div className="min-h-screen w-screen flex items-center justify-center relative overflow-y-auto py-10 px-4 bg-dark">
                        <ToastNotification message={toastData.message} type={toastData.type} onClose={() => setToastData({message: ''})} />
                        <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-gray-800 via-dark to-black opacity-60 pointer-events-none"></div>
                        
                        <div className="glass-panel p-8 sm:p-10 rounded-3xl max-w-md w-full relative z-10 text-center shadow-2xl border-t border-brand/30 transition-all">
                            <h1 className="text-5xl font-black mb-3 neon-text tracking-widest uppercase">ATLAS</h1>
                            
                            {/* MODE 1: MAIN AUTH OPTIONS */}
                            {authScreenMode === 'options' && (
                                <div className="animate-fade-in">
                                    <p className="text-gray-400 mb-6 text-sm">System authentication required. Choose your sign-in method.</p>
                                    <div className="space-y-3.5">
                                        <button
                                            disabled={!fbReady || isAuthenticating}
                                            onClick={() => handleLogin('google')}
                                            className="w-full py-3.5 px-4 glass-panel hover:bg-white/10 rounded-xl flex items-center justify-center gap-3 transition font-semibold disabled:opacity-50 text-white border border-white/15"
                                        >
                                            {isAuthenticating ? <Icons.Spinner /> : <Icons.Google />} 
                                            <span>{isAuthenticating ? 'Connecting to Google...' : 'Continue with Google Popup'}</span>
                                        </button>

                                        <button
                                            type="button"
                                            onClick={() => setAuthScreenMode('gmail_signin')}
                                            className="w-full py-3.5 px-4 bg-blue-600/20 hover:bg-blue-600/30 border border-blue-400/40 rounded-xl flex items-center justify-center gap-3 transition font-semibold text-blue-200"
                                        >
                                            <Icons.Google />
                                            <span>Sign in with Gmail & Password</span>
                                        </button>

                                        <button
                                            type="button"
                                            onClick={() => setAuthScreenMode('gmail_create')}
                                            className="w-full py-3.5 px-4 bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-400/40 rounded-xl flex items-center justify-center gap-2 transition font-semibold text-emerald-300"
                                        >
                                            <Icons.UserPlus />
                                            <span>Create a New Google / Gmail Account</span>
                                        </button>
                                        
                                        <button
                                            disabled={isAuthenticating}
                                            onClick={() => handleLogin('guest')}
                                            className="w-full py-3 glass-panel hover:bg-white/10 rounded-xl flex items-center justify-center gap-3 transition font-medium disabled:opacity-50 text-gray-300 text-sm"
                                        >
                                            Continue as Guest Explorer
                                        </button>
                                        
                                        <div className="pt-4 border-t border-white/10 mt-4">
                                            <button
                                                onClick={() => setAuthScreenMode('admin')}
                                                className="w-full py-3 bg-brand/10 hover:bg-brand/20 border border-brand/30 text-brand rounded-xl transition text-xs font-mono tracking-wider flex justify-center items-center gap-2"
                                            >
                                                <Icons.Lock /> [ OMEGA ACCESS ]
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* MODE 2: SIGN IN WITH GMAIL & PASSWORD (WITH EYE BUTTON) */}
                            {authScreenMode === 'gmail_signin' && (
                                <form onSubmit={handleGmailSignIn} className="space-y-4 animate-fade-in text-left">
                                    <div className="text-center mb-4">
                                        <div className="inline-flex items-center justify-center p-2.5 rounded-full bg-white/10 mb-2">
                                            <Icons.Google />
                                        </div>
                                        <h2 className="text-xl font-bold text-white">Sign in with Google</h2>
                                        <p className="text-xs text-gray-400">Use your Gmail Account to continue to ATLAS</p>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-gray-400 uppercase mb-1">Email or Gmail Username</label>
                                        <input
                                            type="text"
                                            value={signInEmail}
                                            onChange={e => setSignInEmail(e.target.value)}
                                            placeholder="yourname@gmail.com"
                                            required
                                            className="w-full bg-black/50 border border-white/20 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand transition"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-gray-400 uppercase mb-1">Password</label>
                                        <PasswordInput
                                            value={signInPassword}
                                            onChange={e => setSignInPassword(e.target.value)}
                                            placeholder="Enter your password"
                                            className="bg-black/50 border border-white/20 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand transition"
                                        />
                                    </div>

                                    <button
                                        type="submit"
                                        disabled={isAuthenticating}
                                        className="w-full py-3 bg-brand text-black font-bold rounded-xl hover:bg-brandDark transition text-sm uppercase tracking-wider flex justify-center items-center gap-2"
                                    >
                                        {isAuthenticating ? <Icons.Spinner /> : 'Sign In'}
                                    </button>

                                    <div className="flex justify-between items-center pt-2 text-xs">
                                        <button
                                            type="button"
                                            onClick={() => setAuthScreenMode('gmail_create')}
                                            className="text-brand hover:underline font-semibold"
                                        >
                                            Create account
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setAuthScreenMode('options')}
                                            className="text-gray-400 hover:text-white"
                                        >
                                            ← Back to all options
                                        </button>
                                    </div>
                                </form>
                            )}

                            {/* MODE 3: GOOGLE-STYLE CREATE A GMAIL ACCOUNT FLOW (WITH EYE BUTTONS & PHOTO UPLOAD) */}
                            {authScreenMode === 'gmail_create' && (
                                <form onSubmit={handleCreateGmailAccount} className="space-y-3.5 animate-fade-in text-left">
                                    <div className="text-center mb-3">
                                        <div className="inline-flex items-center justify-center p-2.5 rounded-full bg-white/10 mb-1">
                                            <Icons.Google />
                                        </div>
                                        <h2 className="text-xl font-bold text-white">Create a Google Account</h2>
                                        <p className="text-xs text-gray-400">Enter your name, choose a Gmail address & photo</p>
                                    </div>

                                    {/* Optional Profile Photo Picker right at creation */}
                                    <div className="flex items-center gap-3 p-2.5 rounded-xl bg-black/40 border border-white/10">
                                        <img
                                            src={signupAvatar || `https://placehold.co/80x80/0f2942/00f2fe?text=${encodeURIComponent((firstName || 'G').charAt(0).toUpperCase())}`}
                                            alt="Avatar Preview"
                                            className="w-12 h-12 rounded-full object-cover border-2 border-brand/50"
                                        />
                                        <div className="flex-1">
                                            <label className="text-xs font-bold text-brand hover:underline cursor-pointer block">
                                                + Upload Profile Picture (Optional)
                                                <input type="file" accept="image/*" className="hidden" onChange={handleSignupAvatarUpload} />
                                            </label>
                                            <span className="text-[11px] text-gray-400">You can also change this anytime later</span>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2.5">
                                        <div>
                                            <label className="block text-[11px] font-bold text-gray-400 uppercase mb-1">First Name</label>
                                            <input
                                                type="text"
                                                value={firstName}
                                                onChange={e => setFirstName(e.target.value)}
                                                placeholder="First name"
                                                required
                                                className="w-full bg-black/50 border border-white/20 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-brand"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-bold text-gray-400 uppercase mb-1">Last Name</label>
                                            <input
                                                type="text"
                                                value={lastName}
                                                onChange={e => setLastName(e.target.value)}
                                                placeholder="Last name (opt)"
                                                className="w-full bg-black/50 border border-white/20 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-brand"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-bold text-gray-400 uppercase mb-1">Choose your Gmail address</label>
                                        <div className="flex items-center bg-black/50 border border-white/20 rounded-xl overflow-hidden focus-within:border-brand">
                                            <input
                                                type="text"
                                                value={gmailUsername}
                                                onChange={e => setGmailUsername(e.target.value)}
                                                placeholder="username"
                                                required
                                                className="flex-1 bg-transparent px-3 py-2.5 text-sm text-white focus:outline-none"
                                            />
                                            {!gmailUsername.includes('@') && (
                                                <span className="px-3 py-2.5 bg-white/10 text-xs font-mono text-gray-300 border-l border-white/10">
                                                    @gmail.com
                                                </span>
                                            )}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-bold text-gray-400 uppercase mb-1">Create Password</label>
                                        <PasswordInput
                                            value={createPassword}
                                            onChange={e => setCreatePassword(e.target.value)}
                                            placeholder="Password (min 6 chars)"
                                            className="bg-black/50 border border-white/20 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-brand"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-bold text-gray-400 uppercase mb-1">Confirm Password</label>
                                        <PasswordInput
                                            value={confirmPassword}
                                            onChange={e => setConfirmPassword(e.target.value)}
                                            placeholder="Confirm password"
                                            className="bg-black/50 border border-white/20 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-brand"
                                        />
                                    </div>

                                    <button
                                        type="submit"
                                        disabled={isAuthenticating}
                                        className="w-full py-3 bg-brand text-black font-bold rounded-xl hover:bg-brandDark transition text-sm uppercase tracking-wider flex justify-center items-center gap-2 mt-2"
                                    >
                                        {isAuthenticating ? <Icons.Spinner /> : 'Create Gmail Account & Sign In'}
                                    </button>

                                    <div className="flex justify-between items-center pt-1 text-xs">
                                        <button
                                            type="button"
                                            onClick={() => setAuthScreenMode('gmail_signin')}
                                            className="text-brand hover:underline font-semibold"
                                        >
                                            Sign in instead
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setAuthScreenMode('options')}
                                            className="text-gray-400 hover:text-white"
                                        >
                                            ← Back
                                        </button>
                                    </div>
                                </form>
                            )}

                            {/* MODE 4: OMEGA ADMIN LOGIN (WITH EYE BUTTON) */}
                            {authScreenMode === 'admin' && (
                                <form onSubmit={handleDirectAdminLogin} className="space-y-4 animate-fade-in">
                                    <p className="text-brand font-mono text-sm mb-4 uppercase tracking-widest">Admin Terminal</p>
                                    <input
                                        type="text"
                                        value={adminId}
                                        onChange={e => setAdminId(e.target.value)}
                                        placeholder="Admin ID"
                                        className="w-full bg-black/40 border border-brand/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand transition text-brand font-mono"
                                        required
                                    />
                                    <PasswordInput
                                        value={adminPass}
                                        onChange={e => setAdminPass(e.target.value)}
                                        placeholder="Passphrase"
                                        className="bg-black/40 border border-brand/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand transition text-brand font-mono"
                                    />
                                    <button
                                        type="submit"
                                        disabled={isAuthenticating}
                                        className="w-full py-3 bg-brand text-black font-bold rounded-xl hover:bg-brandDark transition uppercase tracking-wider mt-2 flex justify-center items-center gap-2"
                                    >
                                        {isAuthenticating ? <Icons.Spinner /> : 'Initialize God Mode'}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setAuthScreenMode('options')}
                                        className="w-full py-2 text-gray-400 hover:text-white transition text-sm"
                                    >
                                        Cancel Protocol
                                    </button>
                                </form>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="relative min-h-screen flex flex-col">
                    <ToastNotification message={toastData.message} type={toastData.type} onClose={() => setToastData({message: ''})} />
                    
                    {bgMedia && <img src={bgMedia} className="fullscreen-bg" alt="Custom BG" />}
                    {!bgMedia && <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-brandDark/10 via-dark to-black -z-10 fixed"></div>}
                    
                    <label className="fixed bottom-24 right-24 md:right-32 z-40 p-4 glass-panel rounded-full cursor-pointer hover:bg-white/20 transition group shadow-[0_0_15px_rgba(255,255,255,0.1)] hover:shadow-[0_0_25px_rgba(255,255,255,0.2)] flex items-center justify-center" title="Customize Background">
                        <Icons.Pen />
                        <input type="file" accept="image/*" className="hidden" onChange={handleBgUpload} />
                        <span className="absolute -top-10 bg-black text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition whitespace-nowrap border border-white/10 pointer-events-none">Upload BG</span>
                    </label>

                    <nav className="fixed top-0 w-full glass-panel z-50 h-16 flex items-center px-4 justify-between transition-colors">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setMenuOpen(true)} className="p-2 hover:bg-white/10 rounded transition"><Icons.Menu /></button>
                            {view !== 'home' && view !== 'login' && (
                                <button onClick={() => navigate('home')} className="p-2 hover:bg-white/10 rounded transition flex items-center gap-2 text-sm text-gray-300 hover:text-white">
                                    <Icons.Back /> <span className="hidden sm:inline font-bold uppercase tracking-wider">Back</span>
                                </button>
                            )}
                            <span onClick={() => navigate('home')} className="text-2xl font-black neon-text uppercase tracking-widest cursor-pointer select-none hidden sm:block ml-2">ATLAS</span>
                        </div>

                        <div className="flex items-center gap-3">
                            <button
                                onClick={() => navigate('nicl_exam')}
                                className={`px-3.5 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider transition flex items-center gap-1.5 border ${
                                    view === 'nicl_exam'
                                        ? 'bg-brand text-black border-brand shadow-[0_0_15px_rgba(0,242,254,0.5)]'
                                        : 'bg-brand/15 text-brand border-brand/40 hover:bg-brand/25'
                                }`}
                            >
                                <Icons.Academic />
                                <span>NICL AO IT Exam</span>
                            </button>

                            <button
                                onClick={() => navigate('complaints')}
                                className={`hidden sm:flex px-3 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider transition items-center gap-1.5 border ${
                                    view === 'complaints'
                                        ? 'bg-purple-500 text-white border-purple-400'
                                        : 'bg-white/5 text-gray-300 border-white/15 hover:bg-white/10'
                                }`}
                                title="Report an issue or check Admin replies"
                            >
                                <Icons.Support />
                                <span>Help / Complaint</span>
                            </button>

                            <div className="flex items-center gap-2.5 cursor-pointer hover:bg-white/10 p-1 pr-3 rounded-full transition border border-transparent hover:border-white/15" onClick={() => navigate('profile')} title="Click to edit your Name or Photo">
                                <img
                                    src={user.avatar || `https://placehold.co/100x100/0f2942/00f2fe?text=${encodeURIComponent((user.name || 'U').charAt(0).toUpperCase())}`}
                                    alt="Profile"
                                    className="w-9 h-9 rounded-full border-2 border-brand/60 object-cover"
                                />
                                <div className="hidden md:flex flex-col text-left">
                                    <span className="text-xs font-bold leading-tight text-white">{user.name}</span>
                                    <span className="text-[10px] text-brand leading-tight">Edit Profile</span>
                                </div>
                            </div>
                        </div>
                    </nav>

                    {menuOpen && (
                        <div className="fixed inset-0 z-[60] bg-black/50 backdrop-blur-md flex" onClick={() => setMenuOpen(false)}>
                            <div className="w-64 sm:w-80 h-full glass-panel border-r border-white/20 p-6 flex flex-col overflow-y-auto" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-8">
                                    <span className="text-xl font-bold gradient-text tracking-widest">NAVIGATION</span>
                                    <button onClick={() => setMenuOpen(false)} className="hover:text-brand transition"><Icons.X /></button>
                                </div>
                                <div className="flex flex-col gap-2 font-medium">
                                    {['home', 'profile', 'projects', 'education', 'skills', 'experience'].map(item => (
                                        <button
                                            key={item}
                                            onClick={() => navigate(item)}
                                            className={`text-left px-4 py-3 rounded transition uppercase tracking-wider text-sm ${view === item ? 'bg-brand/20 text-brand font-bold' : 'hover:bg-white/10 text-gray-200'}`}
                                        >
                                            {item}
                                        </button>
                                    ))}
                                    <button
                                        onClick={() => navigate('nicl_exam')}
                                        className={`text-left px-4 py-3 rounded transition uppercase tracking-wider text-sm font-bold border mt-2 flex items-center gap-2 ${
                                            view === 'nicl_exam'
                                                ? 'bg-brand text-black border-brand'
                                                : 'bg-brand/15 hover:bg-brand/25 text-brand border-brand/40'
                                        }`}
                                    >
                                        <Icons.Academic /> NICL AO IT Exam Hub
                                    </button>
                                    <button
                                        onClick={() => navigate('complaints')}
                                        className={`text-left px-4 py-3 rounded transition uppercase tracking-wider text-sm font-bold border mt-2 flex items-center gap-2 ${
                                            view === 'complaints'
                                                ? 'bg-purple-500 text-white border-purple-400'
                                                : 'bg-purple-500/15 hover:bg-purple-500/25 text-purple-300 border-purple-500/40'
                                        }`}
                                    >
                                        <Icons.Support /> Help & Complaint Box
                                    </button>
                                    <button onClick={() => navigate('terminal')} className="text-left px-4 py-3 rounded hover:bg-brand/20 text-brand transition uppercase tracking-wider text-sm font-bold border border-brand/20 mt-2">
                                        &gt;_ Terminal
                                    </button>
                                    {user?.role === 'admin' && (
                                        <button onClick={() => navigate('admin')} className="text-left px-4 py-3 rounded hover:bg-red-500/20 text-red-400 transition uppercase tracking-wider text-sm font-bold border border-red-500/20 mt-4">
                                            Admin System (Viewers & Tickets)
                                        </button>
                                    )}
                                </div>
                                <div className="mt-auto pt-6 border-t border-white/10">
                                    <button onClick={handleLogout} className="w-full text-left px-4 py-3 rounded hover:bg-red-500/20 hover:text-red-300 transition uppercase tracking-wider text-sm text-gray-400">
                                        Log Out
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="flex-grow pt-24 pb-32">
                        {view === 'home' && <Home adminProfile={adminProfile} user={user} onNavigate={navigate} />}
                        {view === 'skills' && <Skills />}
                        {view === 'experience' && <Experience />}
                        {view === 'education' && <Education />}
                        {view === 'projects' && <Projects />}
                        {view === 'nicl_exam' && <NICLExamSimulator user={user} notify={triggerToast} />}
                        {view === 'complaints' && <ComplaintDesk user={user} notify={triggerToast} />}
                        {view === 'profile' && <ProfileSettings user={user} setUser={setUser} setAdminProfile={setAdminProfile} theme={theme} setTheme={setTheme} notify={triggerToast} />}
                        {view === 'terminal' && <InteractiveTerminal />}
                        {view === 'admin' && user?.role === 'admin' && <AdminDashboard currentUser={user} notify={triggerToast} siteStats={siteStats} />}
                        {view === 'admin' && user?.role !== 'admin' && (
                            <div className="flex justify-center items-center h-[50vh]"><p className="text-red-500 font-mono text-xl border border-red-500 p-4 bg-red-500/10 rounded">ACCESS DENIED. OMEGA PRIVILEGES REQUIRED.</p></div>
                        )}
                        <Footer />
                    </main>

                    <div className="fixed bottom-0 w-full p-4 z-30 pointer-events-none">
                        <div className="glass-panel mx-auto max-w-2xl rounded-2xl h-14 flex items-center justify-around px-4 pointer-events-auto shadow-2xl border border-white/10">
                           <button onClick={()=>navigate('home')} className={`text-xs uppercase font-bold tracking-widest hover:text-brand transition ${view==='home'?'text-brand drop-shadow-[0_0_5px_#00f2fe]':'text-gray-400'}`}>Overview</button>
                           <button onClick={()=>navigate('projects')} className={`text-xs uppercase font-bold tracking-widest hover:text-brand transition ${view==='projects'?'text-brand drop-shadow-[0_0_5px_#00f2fe]':'text-gray-400'}`}>Work</button>
                           <button onClick={()=>navigate('nicl_exam')} className={`text-xs uppercase font-bold tracking-widest hover:text-brand transition flex items-center gap-1 ${view==='nicl_exam'?'text-brand drop-shadow-[0_0_5px_#00f2fe]':'text-emerald-400'}`}>★ NICL Exam</button>
                           <button onClick={()=>navigate('complaints')} className={`text-xs uppercase font-bold tracking-widest hover:text-brand transition ${view==='complaints'?'text-brand drop-shadow-[0_0_5px_#00f2fe]':'text-purple-400'}`}>Support</button>
                           <button onClick={()=>navigate('profile')} className={`text-xs uppercase font-bold tracking-widest hover:text-brand transition ${view==='profile'?'text-brand drop-shadow-[0_0_5px_#00f2fe]':'text-gray-400'}`}>Profile</button>
                        </div>
                    </div>

                    {view !== 'login' && <ChatSystem currentUser={user} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
